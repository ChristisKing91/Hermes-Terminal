name: LXRION Agentic Portal CI
on:
  pull_request:
    paths:
      - "src/hermes_terminal/coordinator_snapshot.py"
      - "src/hermes_terminal/portal.py"
      - "src/hermes_terminal/portal.html"
      - "src/hermes_terminal/model_capabilities.py"
      - "src/hermes_terminal/ai/ollama.py"
      - "tests/test_coordinator_snapshot.py"
      - "tests/test_portal.py"
      - "tests/test_model_routing.py"
      - "tests/test_local_inference.py"
      - "src/hermes_terminal/local_inference.py"
      - "pyproject.toml"
      - ".github/workflows/agentic-portal.yml"
  push:
    branches:
      - "feature/lxrion-agentic-stack-20261109"
jobs:
  local-portal-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optional portal and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,portal]"
      - name: Compile Python modules
        run: python -m compileall -q src/hermes_terminal/portal.py src/hermes_terminal/coordinator_snapshot.py src/hermes_terminal/model_capabilities.py
      - name: Run synthetic adapter and portal tests
        run: python -m pytest -q tests/test_coordinator_snapshot.py tests/test_portal.py tests/test_model_routing.py tests/test_local_inference.py
